secrets:
  DB_PASSWORD:
    file: ./secrets/db_password.txt
  SECRET_JWT:
    file: ./secrets/secret_jwt.txt
  PEPPER:
    file: ./secrets/pepper.txt

services:
  service-usuario:
    build: ./service-usuario
    ports:
      - '3000:3000' # Por enquanto vai ter acesso público pra teste, e pq n temos o API Gateway pronto.
    depends_on:
      - db-usuario
    volumes:
      - ./service-usuario:/usr/src/app # Meu código = Código no container
      - /usr/src/app/node_modules # node_modules do container != meu node_modules
    env_file:
      - ./service-usuario/.env
    secrets:
      - DB_PASSWORD
      - SECRET_JWT
      - PEPPER

  db-usuario:
    image: postgres:15
    environment:
      POSTGRES_DB: banco
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PASSWORD
    volumes:
      - db-data:/var/lib/postgresql/data
    secrets:
      - DB_PASSWORD

  pgadmin:
    # Para poder editar os bancos - demora pra inicializar
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: 123456
    ports:
      - "5050:80"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-devops
    ports:
      - "5672:5672" # Porta padrão para os microsserviços conectarem
      - "15672:15672" # Painel visual do RabbitMQ (acesse http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  db-data:
