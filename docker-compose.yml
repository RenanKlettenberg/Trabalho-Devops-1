services:
  service-usuario:
    build: ./service-usuario
    ports:
      - '3000:3000' #Por enquanto vai ter acesso público pra teste, e pq n temos o API Gateway pronto.
    depends_on:
      - db-usuario
    volumes:
      - ./service-usuario:/usr/src/app     # Meu código = Código no container
      - /usr/src/app/node_modules # node_modules do container != meu node_modules

  db-usuario:
    image: postgres:15
    environment:
      POSTGRES_DB: banco
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: senha
    volumes:
      - db-data:/var/lib/postgresql/data
  
  pgadmin: #Para poder editar os bancos - demora pra inicializar
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: 123456
    ports:
      - "5050:80"

volumes:
  db-data: