secrets:
  DB_PASSWORD:
    file: ./secrets/db_password.txt
  SECRET_JWT:
    file: ./secrets/secret_jwt.txt
  PEPPER:
    file: ./secrets/pepper.txt

services:
  # Porta única de entrada do sistema (padrão API Gateway). — ver api-gateway/nginx.conf.
  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      # Declara a relação, mas o gateway NÃO depende deles para subir: o
      # `resolver` do nginx.conf resolve os nomes a cada requisição, então
      # ele funciona mesmo com algum serviço fora do ar.
      - service-usuario
      - service-viagens
      - service-grupos
      - service-despesas
      - service-orquestrador

  service-viagens:
    build: ./service-viagens
    # Porta fechada de proposito: o acesso a este servico e feito pelo
    # API Gateway (http://localhost:8080). Ele continua alcancavel pelos
    # outros containers pelo nome de servico na rede do Docker.
    depends_on:
      - db-viagens
    volumes:
      - ./service-viagens:/usr/src/app # Meu código = Código no container
      - /usr/src/app/node_modules # node_modules do container != meu node_modules
    env_file:
      - ./service-viagens/.env
    secrets:
      - DB_PASSWORD

  db-viagens:
    image: postgres:15
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: viagens_db
      POSTGRES_USER: usuario     
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PASSWORD
    volumes:
      - db-viagens-data:/var/lib/postgresql/data
    secrets:
      - DB_PASSWORD

  service-usuario:
    build: ./service-usuario
    # Porta fechada de proposito
    depends_on:
      - db-usuario
    volumes:
      - ./service-usuario:/usr/src/app # Meu código = Código no container
      - /usr/src/app/node_modules # node_modules do container != meu node_modules
    env_file:
      - ./service-usuario/.env
    secrets:
      - DB_PASSWORD
      - SECRET_JWT
      - PEPPER

  db-usuario:
    image: postgres:15
    environment:
      POSTGRES_DB: banco
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PASSWORD
    volumes:
      - db-data:/var/lib/postgresql/data
    secrets:
      - DB_PASSWORD

  service-grupos:
    build: ./service-grupos
    # Porta fechada de proposito
    depends_on:
      - db-grupos
      - rabbitmq
    volumes:
      - ./service-grupos:/usr/src/app # Meu código = Código no container
      - /usr/src/app/node_modules # node_modules do container != meu node_modules
    env_file:
      - ./service-grupos/.env
    secrets:
      - DB_PASSWORD
      - SECRET_JWT

  db-grupos:
    image: postgres:15
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: grupos_db
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PASSWORD
    volumes:
      - db-grupos-data:/var/lib/postgresql/data
    secrets:
      - DB_PASSWORD

  service-despesas:
    build: ./service-despesas
    # Porta fechada de proposito
    depends_on:
      - db-despesas
      - rabbitmq
      - redis
    volumes:
      - ./service-despesas:/usr/src/app # Meu código = Código no container
      - /usr/src/app/node_modules # node_modules do container != meu node_modules
    env_file:
      - ./service-despesas/.env
    secrets:
      - DB_PASSWORD

  db-despesas:
    image: postgres:15
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: despesas_db
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PASSWORD
    volumes:
      - db-despesas-data:/var/lib/postgresql/data
      - ./service-despesas/init.sql:/docker-entrypoint-initdb.d/init.sql
    secrets:
      - DB_PASSWORD

  service-orquestrador:
    build: ./service-orquestrador
    # Porta fechada de proposito
    depends_on:
      db-orquestrador:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./service-orquestrador:/usr/src/app # Meu código = Código no container
      - /usr/src/app/node_modules # node_modules do container != meu node_modules
    env_file:
      - ./service-orquestrador/.env
    secrets:
      - DB_PASSWORD

  db-orquestrador:
    image: postgres:15
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: orquestrador_db
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PASSWORD
    volumes:
      - db-orquestrador-data:/var/lib/postgresql/data
      - ./service-orquestrador/init.sql:/docker-entrypoint-initdb.d/init.sql
    secrets:
      - DB_PASSWORD

  pgadmin:
    # Para poder editar os bancos - demora pra inicializar
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: 123456
    ports:
      - "5050:80"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-devops
    ports:
      - "5672:5672" # Porta padrão para os microsserviços conectarem
      - "15672:15672" # Painel visual do RabbitMQ (acesse http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis-devops
    ports:
      - "6379:6379" # Cache do service-despesas (taxas de câmbio, dashboard)

volumes:
  db-data:
  db-viagens-data:
  db-grupos-data:
  db-despesas-data:
  db-orquestrador-data: