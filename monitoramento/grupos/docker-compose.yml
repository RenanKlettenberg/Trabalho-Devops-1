services:
  prometheus-grupos:
    image: prom/prometheus
    container_name: prometheus-grupos
    ports:
      - "9092:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_grupos_data:/prometheus

  grafana-grupos:
    image: grafana/grafana
    container_name: grafana-grupos
    ports:
      - "3004:3000"
    volumes:
      # Datasource e dashboard são carregados destes arquivos (provisioning)
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_grupos_data:/var/lib/grafana
    depends_on:
      - prometheus-grupos

volumes:
  prometheus_grupos_data:
  grafana_grupos_data:
