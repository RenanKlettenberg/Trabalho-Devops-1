apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-grupos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-grupos
  template:
    metadata:
      labels:
        app: service-grupos
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3002"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: service-grupos
          image: ghcr.io/renanklettenberg/service-grupos:1.3.0
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: service-grupos-config
            - secretRef:
                name: service-grupos-secret
