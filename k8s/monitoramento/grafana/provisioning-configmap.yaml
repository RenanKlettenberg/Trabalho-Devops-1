# O Grafana já sobe configurado: datasource (Prometheus) e pasta de dashboards.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: tripmanager
        folder: TripManager
        type: file
        options:
          path: /var/lib/grafana/dashboards
