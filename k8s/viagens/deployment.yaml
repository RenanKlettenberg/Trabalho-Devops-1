apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-viagens
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-viagens
  template:
    metadata:
      labels:
        app: service-viagens
    spec:
      containers:
        - name: service-viagens
          image: ghcr.io/renanklettenberg/service-viagens:1.2.0
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: service-viagens-config
            - secretRef:
                name: service-viagens-secret