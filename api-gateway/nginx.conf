# Porta única de entrada do sistema. O cliente (Postman, front-end) fala só com
# este endereço; quem descobre qual microsserviço responde cada rota é aqui.
#
#   /api/v1/usuario, /api/v1/session                  -> service-usuario:3000
#   /api/v1/viagem, /api/v1/evento                    -> service-viagens:3001
#   /api/v1/grupo, /api/v1/participante,
#   /api/v1/despesa-participante, /api/v1/health      -> service-grupos:3002
#   /api/despesas                                     -> service-despesas:3003
#   /api/dashboard/<viagemId>                         -> service-despesas:3003
#   /api/sagas                                        -> service-orquestrador:3004
#
# AUTENTICACAO: o gateway valida o JWT antes de encaminhar (ver auth.js).
# Rotas publicas, que NAO exigem token:
#
#   GET  /health                 saude do proprio gateway
#   POST /api/v1/session         login
#   POST /api/v1/usuario         cadastro
#
# Os microsservicos continuam validando o token por conta propria: o gateway
# pega quem vem de fora, o servico pega quem chama o container direto pela
# rede do Docker. Duas camadas, de proposito.
#

server {
    listen 80;
    server_name _;

    # resolução a cada requisição
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 10m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Guardam o método e o caminho da requisição ORIGINAL. A subrequisição do
    # `auth_request` é sempre um GET para /_auth, então sem isso o validador
    # njs não teria como saber o que o cliente pediu de verdade. Variáveis do
    # Nginx são compartilhadas entre a requisição e suas subrequisições.
    set $metodo_cliente $request_method;
    set $uri_cliente    $request_uri;


    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"api-gateway"}';
    }

    # Endpoint interno chamado pela diretiva `auth_request`. `internal` faz o
    # Nginx recusar qualquer acesso externo a ele.
    location = /_auth {
        internal;
        js_content auth.verificar;
    }

    # O `auth_request` descarta o corpo da subrequisição e usa só o status.
    # Sem isto, o cliente receberia a página HTML padrão do Nginx; assim ele
    # recebe JSON, no mesmo formato dos microsserviços.
    error_page 401 = @nao_autenticado;

    location @nao_autenticado {
        default_type application/json;
        return 401 '{"code":"SES02","message":"Faça login para poder continuar.","origem":"api-gateway"}';
    }

    # ---------------------------------------------------------------- usuário
    location /api/v1/usuario {
        auth_request /_auth;

        set $servico http://service-usuario:3000;
        proxy_pass $servico$request_uri;
    }

    location /api/v1/session {
        auth_request /_auth;

        set $servico http://service-usuario:3000;
        proxy_pass $servico$request_uri;
    }

    # ---------------------------------------------------------------- viagens
    location /api/v1/viagem {
        auth_request /_auth;

        set $servico http://service-viagens:3001;
        proxy_pass $servico$request_uri;
    }

    location /api/v1/evento {
        auth_request /_auth;

        set $servico http://service-viagens:3001;
        proxy_pass $servico$request_uri;
    }

    # ----------------------------------------------------------------- grupos
    location /api/v1/grupo {
        auth_request /_auth;

        set $servico http://service-grupos:3002;
        proxy_pass $servico$request_uri;
    }

    location /api/v1/participante {
        auth_request /_auth;

        set $servico http://service-grupos:3002;
        proxy_pass $servico$request_uri;
    }

    location /api/v1/despesa-participante {
        auth_request /_auth;

        set $servico http://service-grupos:3002;
        proxy_pass $servico$request_uri;
    }

#  criei esta rota no meu serviço pra verificar se o microsserviço esta vivo
    location = /api/v1/health {
        auth_request /_auth;

        set $servico http://service-grupos:3002;
        proxy_pass $servico$request_uri;
    }

    # --------------------------------------------------------------- despesas

    #Criar despesa mexe em mais
    #de um serviço — o grupo precisa ser validado antes —, então o caminho é o orquestrador: POST /api/sagas/despesas
    location ~ ^/api/despesas/.+ {
        auth_request /_auth;

        set $servico http://service-despesas:3003;
        proxy_pass $servico$request_uri;
    }

    # dashboard financeiro — é do service-DESPESAS, não do service-viagens
    # (que atende em /api/v1/viagem)
    location /api/dashboard {
        auth_request /_auth;

        set $servico http://service-despesas:3003;
        proxy_pass $servico$request_uri;
    }


    # ----------------------------------------------------------- orquestrador
    location /api/sagas {
        auth_request /_auth;

        set $servico http://service-orquestrador:3004;
        proxy_pass $servico$request_uri;


        proxy_read_timeout 30s;
    }

    location / {
        default_type application/json;
        return 404 '{"erro":"Rota nao encontrada no API Gateway"}';
    }
}
