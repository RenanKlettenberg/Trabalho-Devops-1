
#   /api/v1/usuario, /api/v1/session                  -> ${USUARIO_URL}
#   /api/v1/viagem, /api/v1/evento                    -> ${VIAGENS_URL}
#   /api/v1/grupo, /api/v1/participante,
#   /api/v1/despesa-participante, /api/v1/health      -> ${GRUPOS_URL}
#   /api/despesas                                     -> ${DESPESAS_URL}
#   /api/dashboard/<viagemId>                         -> ${DESPESAS_URL}
#   /api/sagas                                        -> ${ORQUESTRADOR_URL}
#
# Este arquivo é um TEMPLATE: as variáveis ${..._URL} são trocadas na
# inicialização do container (ver api-gateway/Dockerfile).
#   - local (docker-compose): http://service-grupos:3002 ...
#   - Render (DEV/HOMOL):     https://grupos-dev.onrender.com ...
#

server {
    listen 80;
    server_name _;

    # resolução a cada requisição; o DNS vem do ambiente (Docker local ou Render)
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

    client_max_body_size 10m;

    # Host do serviço de destino (e não o do gateway): o Render decide qual
    # serviço entregar pelo Host, e com $host ele responderia 404.
    proxy_set_header Host              $proxy_host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Os serviços no Render usam HTTPS: envia o nome do servidor no handshake TLS (SNI)
    proxy_ssl_server_name on;


    set $metodo_cliente $request_method;
    set $uri_cliente    $request_uri;


    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"api-gateway"}';
    }


    # Versão do gateway que está no ar (gravada na imagem pela pipeline)
    location = /version {
        default_type application/json;
        return 200 '{"service":"api-gateway","version":"${APP_VERSION}","commit":"${APP_COMMIT}"}';
    }

    location = /_auth {
        internal;
        js_content auth.verificar;
    }


    error_page 401 = @nao_autenticado;

    location @nao_autenticado {
        default_type application/json;
        return 401 '{"code":"SES02","message":"Faça login para poder continuar.","origem":"api-gateway"}';
    }

    # ---------------------------------------------------------------- usuário
    location /api/v1/usuario {
        auth_request /_auth;

        set $servico ${USUARIO_URL};
        proxy_pass $servico$request_uri;
    }

    location /api/v1/session {
        set $servico ${USUARIO_URL};
        proxy_pass $servico$request_uri;
    }

    location = /usuario/metrics {
        set $servico ${USUARIO_URL};
        proxy_pass $servico/metrics;
    }

    location = /usuario/api-docs {
        rewrite ^ /usuario/api-docs/ permanent;
    }

    location /usuario/api-docs/ {
        set $servico ${USUARIO_URL};
        rewrite ^/usuario(/api-docs/.*)$ $1 break;
        proxy_pass $servico;
        proxy_redirect /api-docs/ /usuario/api-docs/;
    }

    # ---------------------------------------------------------------- viagens
    location /api/v1/viagem {
        auth_request /_auth;

        set $servico ${VIAGENS_URL};
        proxy_pass $servico$request_uri;
    }

    location /api/v1/evento {
        auth_request /_auth;

        set $servico ${VIAGENS_URL};
        proxy_pass $servico$request_uri;
    }

     location = /viagem/metrics {
        set $servico ${VIAGENS_URL};
        proxy_pass $servico/metrics;
    }

    location = /viagem/api-docs {
        rewrite ^ /viagem/api-docs/ permanent;
    }

    location /viagem/api-docs/ {
        set $servico ${VIAGENS_URL};
        rewrite ^/viagem(/api-docs/.*)$ $1 break;
        proxy_pass $servico;
        proxy_redirect /api-docs/ /viagem/api-docs/;
    }

    # ----------------------------------------------------------------- grupos
    location /api/v1/grupo {
        auth_request /_auth;

        set $servico ${GRUPOS_URL};
        proxy_pass $servico$request_uri;
    }

    location /api/v1/participante {
        auth_request /_auth;

        set $servico ${GRUPOS_URL};
        proxy_pass $servico$request_uri;
    }

    location /api/v1/despesa-participante {
        auth_request /_auth;

        set $servico ${GRUPOS_URL};
        proxy_pass $servico$request_uri;
    }

#  criei esta rota no meu serviço pra verificar se o microsserviço esta vivo
    location = /api/v1/health {
        auth_request /_auth;

        set $servico ${GRUPOS_URL};
        proxy_pass $servico$request_uri;
    }

    location = /grupos/version {
        set $servico ${GRUPOS_URL};
        proxy_pass $servico/api/v1/version;
    }

    location = /grupos/metrics {
        set $servico ${GRUPOS_URL};
        proxy_pass $servico/metrics;
    }

    # Swagger do service-grupos (só responde onde SWAGGER_ENABLED=true, ou seja, DEV)
    location = /grupos/api-docs {
        return 301 /grupos/api-docs/;
    }

    location /grupos/api-docs/ {
        set $servico ${GRUPOS_URL};
        rewrite ^/grupos(/api-docs/.*)$ $1 break;
        proxy_pass $servico;
        proxy_redirect /api-docs/ /grupos/api-docs/;
    }

    # --------------------------------------------------------------- despesas

    #Criar despesa mexe em mais
    #de um serviço — o grupo precisa ser validado antes —, então o caminho é o orquestrador: POST /api/sagas/despesas
    location ~ ^/api/despesas/.+ {
        auth_request /_auth;

        set $servico ${DESPESAS_URL};
        proxy_pass $servico$request_uri;
    }

    # dashboard financeiro — é do service-DESPESAS, não do service-viagens
    # (que atende em /api/v1/viagem)
    location /api/dashboard {
        auth_request /_auth;

        set $servico ${DESPESAS_URL};
        proxy_pass $servico$request_uri;
    }

    location = /despesas/metrics {
        set $servico ${DESPESAS_URL};
        proxy_pass $servico/metrics;
    }

    # Swagger do service-despesas (o "Try it out" chama /api/despesas pelo próprio gateway)
    location = /despesas/api-docs {
        return 301 /despesas/api-docs/;
    }

    location /despesas/api-docs/ {
        set $servico ${DESPESAS_URL};
        rewrite ^/despesas(/api-docs/.*)$ $1 break;
        proxy_pass $servico;
    }


    # ----------------------------------------------------------- orquestrador
    location /api/sagas {
        auth_request /_auth;

        set $servico ${ORQUESTRADOR_URL};
        proxy_pass $servico$request_uri;


        proxy_read_timeout 30s;
    }

    location / {
        default_type application/json;
        return 404 '{"erro":"Rota nao encontrada no API Gateway"}';
    }
}
