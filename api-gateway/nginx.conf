# Porta única de entrada do sistema. O cliente (Postman, front-end) fala só com
# este endereço; quem descobre qual microsserviço responde cada rota é aqui.
#
#   /api/v1/usuario, /api/v1/session                  -> service-usuario:3000
#   /api/v1/viagem, /api/v1/evento                    -> service-viagens:3001
#   /api/v1/grupo, /api/v1/participante,
#   /api/v1/despesa-participante, /api/v1/health      -> service-grupos:3002
#   /api/despesas                                     -> service-despesas:3003
#   /api/dashboard/<viagemId>                         -> service-despesas:3003
#   /api/sagas                                        -> service-orquestrador:3004
#

server {
    listen 80;
    server_name _;

    # resolução a cada requisição
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 10m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;


    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"api-gateway"}';
    }

    # ---------------------------------------------------------------- usuário
    location /api/v1/usuario {
        set $servico http://service-usuario:3000;
        proxy_pass $servico$request_uri;
    }

    location /api/v1/session {
        set $servico http://service-usuario:3000;
        proxy_pass $servico$request_uri;
    }

    # ---------------------------------------------------------------- viagens
    location /api/v1/viagem {
        set $servico http://service-viagens:3001;
        proxy_pass $servico$request_uri;
    }

    location /api/v1/evento {
        set $servico http://service-viagens:3001;
        proxy_pass $servico$request_uri;
    }

    # ----------------------------------------------------------------- grupos
    location /api/v1/grupo {
        set $servico http://service-grupos:3002;
        proxy_pass $servico$request_uri;
    }

    location /api/v1/participante {
        set $servico http://service-grupos:3002;
        proxy_pass $servico$request_uri;
    }

    location /api/v1/despesa-participante {
        set $servico http://service-grupos:3002;
        proxy_pass $servico$request_uri;
    }

#  criei esta rota no meu serviço pra verificar se o microsserviço esta vivo
    location = /api/v1/health {
        set $servico http://service-grupos:3002;
        proxy_pass $servico$request_uri;
    }

    # --------------------------------------------------------------- despesas
    location /api/despesas {
        set $servico http://service-despesas:3003;
        proxy_pass $servico$request_uri;
    }

    # dashboard financeiro — é do service-DESPESAS, não do service-viagens
    # (que atende em /api/v1/viagem)
    location /api/dashboard {
        set $servico http://service-despesas:3003;
        proxy_pass $servico$request_uri;
    }


    # ----------------------------------------------------------- orquestrador
    location /api/sagas {
        set $servico http://service-orquestrador:3004;
        proxy_pass $servico$request_uri;


        proxy_read_timeout 30s;
    }

    location / {
        default_type application/json;
        return 404 '{"erro":"Rota nao encontrada no API Gateway"}';
    }
}
