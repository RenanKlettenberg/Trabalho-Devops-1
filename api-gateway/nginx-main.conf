# Configuração principal do Nginx.
#
# Existe só por causa de duas diretivas que NÃO funcionam dentro de
# conf.d/default.conf: `load_module` e `js_import` precisam do contexto
# principal e do bloco http, respectivamente. O roteamento continua todo em
# nginx.conf, incluído no fim deste arquivo.
#
# É uma cópia do padrão da imagem nginx:alpine, com as três linhas do njs.

# njs: o JavaScript embutido do Nginx, usado para validar o JWT.
load_module modules/ngx_http_js_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Validador de JWT — ver api-gateway/auth.js
    js_import auth from /etc/nginx/njs/auth.js;

    include /etc/nginx/conf.d/*.conf;
}
