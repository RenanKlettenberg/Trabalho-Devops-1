# Nome que aparece na aba Actions do GitHub
name: service-grupos

# QUANDO a pipeline roda
on:
  push:
    branches: [develop, main, 'feature/**']
    paths:
      - 'service-grupos/**'
      - '.github/workflows/service-grupos.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'service-grupos/**'
      - '.github/workflows/service-grupos.yml'

# O QUE a pipeline faz
jobs:
  ci:
    name: Build e testes
    runs-on: ubuntu-latest

    # Banco temporário só para os testes (é apagado no fim da pipeline)
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: grupos_db
          POSTGRES_USER: usuario
          POSTGRES_PASSWORD: senha_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Variáveis que o service-grupos lê (mesmas do .env)
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: grupos_db
      DB_USER: usuario
      DB_PASSWORD: senha_teste
      SECRET_JWT: segredo_so_para_teste

    defaults:
      run:
        working-directory: service-grupos

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: service-grupos/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Criar tabelas no banco de teste
        run: psql -h localhost -U usuario -d grupos_db -f init.sql
        env:
          PGPASSWORD: senha_teste

      - name: Rodar testes (unitários + integração)
        run: npm run test:coverage
        
      - name: Análise SonarCloud
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: service-grupos
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_GRUPOS }}

    docker:
    name: Build e publicação da imagem
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Ler versão do package.json
        id: versao
        run: |
          VERSAO=$(node -p "require('./service-grupos/package.json').version")
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=$VERSAO" >> $GITHUB_OUTPUT
          else
            echo "tag=$VERSAO-dev" >> $GITHUB_OUTPUT
          fi

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: service-grupos
          push: true
          tags: |
            ghcr.io/renanklettenberg/service-grupos:${{ github.ref_name }}
            ghcr.io/renanklettenberg/service-grupos:${{ github.sha }}
            ghcr.io/renanklettenberg/service-grupos:${{ steps.versao.outputs.tag }}

      - name: Criar tag da versão no Git
        if: github.ref == 'refs/heads/main'
        run: |
          git tag "service-grupos-v${{ steps.versao.outputs.tag }}"
          git push origin "service-grupos-v${{ steps.versao.outputs.tag }}"

  deploy:
    name: Deploy no Render
    needs: docker
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name == 'main' && 'grupos-homol' || 'grupos-dev' }}
      url: ${{ github.ref_name == 'main' && 'https://grupos-homol.onrender.com' || 'https://grupos-dev.onrender.com' }}

    steps:
      - name: Avisar o Render para atualizar
        run: curl --fail -X POST "$RENDER_HOOK"
        env:
          RENDER_HOOK: ${{ github.ref_name == 'main' && secrets.RENDER_HOOK_GRUPOS_HOMOL || secrets.RENDER_HOOK_GRUPOS_DEV }}
