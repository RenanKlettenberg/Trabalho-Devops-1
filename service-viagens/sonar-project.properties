# Identificação do projeto no SonarCloud
sonar.organization=renanklettenberg
sonar.projectKey=RenanKlettenberg_Trabalho-Devops-1
sonar.projectName=service-usuario

# Onde está o código e onde estão os testes
sonar.sources=src
sonar.exclusions=src/tests/**
