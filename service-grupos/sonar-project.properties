# Identificação do projeto no SonarCloud
sonar.organization=juliapavanello
sonar.projectKey=juliapavanello_service-grupos
sonar.projectName=service-grupos

# Onde está o código e onde estão os testes
sonar.sources=src
sonar.exclusions=src/tests/**
sonar.tests=src/tests

# Relatório de cobertura gerado pelo "npm run test:coverage"
sonar.javascript.lcov.reportPaths=coverage/lcov.info
